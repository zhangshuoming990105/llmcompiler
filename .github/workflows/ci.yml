name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native-checks:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: '3.10'
          - os: ubuntu-latest
            python: '3.13'
          - os: macos-14
            python: '3.13'
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
      - name: Install development tooling
        run: python -m pip install ruff==0.11.2
      - name: Check formatting and imports
        run: |
          ruff check .
          ruff format --check .
      - name: Check public files
        run: python scripts/check_public_tree.py
      - name: Check branch histories
        if: matrix.os == 'ubuntu-latest' && matrix.python == '3.13'
        run: python scripts/check_public_tree.py --history
      - name: Run unit and native compiler tests
        run: python -m unittest discover -s tests -v
      - name: Verify representative controls
        run: python -m lego_compiler selfcheck --output runs/ci-representative
      - name: Verify recursive and long-function controls
        run: python -m lego_compiler selfcheck --manifest benchmarks/recursive/manifest.json --output runs/ci-recursive
